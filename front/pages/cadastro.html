<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Rua minha</title>
  <link rel="stylesheet" href="../styles/cadastro.css">
  <link rel="icon" href="../acervo/icones/Botão ícone .png">
</head>
<body>

  <div class="container" id="cadastro">

    <div class="left">

      <div  class="topLeft"">

        <h2>Cadastrar</h2>

        <p> <span class = "hl">Informações do responsavel</span></p>

        <input type="text" id="novoUsuario" placeholder="Usuário">
        <input type="password" id="novaSenha" placeholder="Senha">
        <input type="email" id="novoEmail" placeholder="Email">
        <input type="text" id="novoCpf" placeholder="CPF">
        <input type="text" id="novaSenhaAdm" placeholder="Senha de atividades">

        <div id="select-check">

          <div class="linha">

            <label name="Pronome" for="pronome">Pronome</label>
            <select id="novoPronome">
            
              <option disabled selected >------</option>
              <option value="ele">Ele</option>
              <option value="ela">Ela</option>
              <option value="nenhum">Nenhum</option>

            </select>

          </div>
      
          <div class="linha">

            <label for="acessibildade">Acessibildade</label>
            <input type="checkbox" id="novaAcessibilidade"> 

          </div>  

        </div>    
      
      </div>

  

      <div class="bottomLeft">

      <br><button onclick="cadastrar()">Cadastrar</button>

      <p> clique aqui para <a onclick="voltarLogin()">Voltar</a> ao login</p>

      </div>
      
    </div>

    <div class="right">

      <div class="topRight">

        <p> <span class = "hl">Informações da  criança </span> </p>

        <input type="text" id="novaCrianca" placeholder="Criança">
        <input type="number" id="novaIdade" placeholder="Idade">
        <input type="text" id="novoEstado" placeholder="Estado">
        <input type="text" id="novaCor" placeholder="Cor favorita">
        <input type="text" id="novaComida" placeholder="Comida favorita">
        <input type="text" id="novoGeneroLit" placeholder="Genero literario favorito">


      </div>

      <div class="bottomRight">

        <div class="playBtn">
              
            <img src="../acervo/personagens/milo/Milo fala 1.png" width="100%" height="100%" id="imagemPlayBtn" alt="">
            
          </div>
            
          <div class="player">
            
            <input type="range" id="barrinha" value="0">
            
          </div>
    
          <audio id="audio" src="../audios/Milo-cadastro.mp3"></audio>

      </div>

    </div>
   
  </div>

  <div class="container" id="login">

    <div class="left">

      <div class="topLeft">

        <h2>Logar</h2>

        <input type="text" id="logarUsuario" placeholder="usuario ou email">
        <input type="password" id="logarSenha" placeholder="senha">
        <button onclick="semLogin()">Não tenho cadastro</button> 
        <button> Logar de outra forma</button>

      </div>

      <div class="bottomLeft">

        <button onclick="logar()">Entrar</button>
        <p> clique aqui para <a href="../index.html">Voltar</a></p>
        <a href="">Esqueci minha senha</a>

      </div>


    </div>

    <div class="right">

      <div class="topRight">

        <img src="../acervo/icones/Botão ícone .png" alt="" width="300px" height="300px">

      </div>

      <div class="bottomRight">

        <div class="playBtn" onclick="audioPlay()">

          <img src="../acervo/personagens/milo/Milo fala 1.png" id="imagemPlayBtn" alt="" width="100%" height="100%">

        </div>
        

        <div class="player">

          <input type="range" id="barrinha" value="0">

        </div>

        <audio src="../audios/Milo-login.mp3" id="audio"></audio>

      </div>


      </div>

    </div>

  </div>

  <script src="../scripts/cadastro.js"></script>
  <script src="../scripts/database_cadastro.js"></script>

</body>
</html>
